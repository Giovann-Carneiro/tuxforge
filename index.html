<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TuxForge — Monte seu PC</title>
  <meta name="description" content="Jogo de cruzadinha de Arquitetura Computacional: acerte as palavras, responda ao quiz e monte o seu PC.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand" aria-label="TuxForge">
      <span class="brand-logo" id="brandLogo"></span>
      <span class="logo">TUX<span>//</span>FORGE<i class="cursor">_</i></span>
    </div>
    <div class="level-pill" id="levelPill">Nível 1</div>
    <div class="top-right">
      <button class="btn shop-btn" id="shopBtn" type="button" title="Abrir a loja de peças">
        🛒 Loja <span class="badge" id="shopBadge" hidden>0</span>
      </button>
      <div class="wallet" title="Dinheiro disponível">
        <span class="wallet-label">Saldo</span>
        <strong id="money">R$ 0</strong>
      </div>
      <button class="btn ghost small" id="newGameBtn" type="button">↺ Novo jogo</button>
    </div>
  </header>

  <main class="layout">

    <!-- ===== Cruzadinha ===== -->
    <section class="game-col" aria-label="Tabuleiro">

      <div class="panel hud">
        <div class="hud-item">
          <span class="hud-label">Palavras</span>
          <strong id="counter">0 de 0 palavras</strong>
        </div>
        <div class="hud-item hud-timer">
          <span class="hud-label">Próxima peça: <b id="timerTier">Ouro</b></span>
          <div class="meter" aria-hidden="true"><div class="meter-fill" id="timerFill"></div></div>
          <small id="timerText">0 s</small>
        </div>
        <div class="hud-item">
          <span class="hud-label">Total</span>
          <strong id="total">0 de 16</strong>
        </div>
      </div>

      <div class="panel board-panel">
        <div class="active-clue" id="activeClue" aria-live="polite">Selecione uma casa para começar.</div>
        <div class="board-wrap" id="boardWrap">
          <div class="board" id="board" role="group" aria-label="Cruzadinha"></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="checkBtn" type="button">✔ Conferir</button>
          <button class="btn ghost" id="hintBtn" type="button">💡 Dica</button>
          <button class="btn danger" id="resetBtn" type="button">⟲ Reiniciar</button>
        </div>
        <div class="message" id="message" aria-live="polite"></div>
      </div>

      <div class="panel clues">
        <div class="clue-col">
          <h3>→ Horizontais</h3>
          <ol id="cluesH"></ol>
        </div>
        <div class="clue-col">
          <h3>↓ Verticais</h3>
          <ol id="cluesV"></ol>
        </div>
      </div>
    </section>

    <!-- ===== Seu PC ===== -->
    <aside class="side-col" aria-label="Seu computador">
      <div class="panel pc-panel">
        <div class="pc-head">
          <div>
            <span class="hud-label">Seu computador</span>
            <strong id="rankName">—</strong>
          </div>
          <div class="score"><span id="score">0</span><small>pts</small></div>
        </div>
        <div id="pcView" class="pc-view"></div>
        <ul class="specs" id="specs"></ul>
        <button class="btn primary pc-shop" id="pcShopBtn" type="button">🛒 Abrir a loja <span class="badge" id="pcShopBadge" hidden>0</span></button>
      </div>
    </aside>
  </main>

  <!-- gradientes e filtros compartilhados pelas ilustrações -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9b8"/><stop offset=".5" stop-color="#e08d4f"/><stop offset="1" stop-color="#7a3f17"/></linearGradient>
      <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c4d0de"/><stop offset="1" stop-color="#6f7f90"/></linearGradient>
      <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6bf"/><stop offset=".5" stop-color="#ffd54a"/><stop offset="1" stop-color="#a8780a"/></linearGradient>
      <linearGradient id="gPcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1a6e"/><stop offset="1" stop-color="#170a2e"/></linearGradient>
      <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c1a4a"/><stop offset="1" stop-color="#0c0618"/></linearGradient>
      <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".38"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
      <linearGradient id="gLiquid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5bd6"/><stop offset="1" stop-color="#c58bff"/></linearGradient>
      <linearGradient id="rgbGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff4d8d"/><stop offset=".33" stop-color="#ffd54a"/><stop offset=".66" stop-color="#38f5c8"/><stop offset="1" stop-color="#8d6bff"/>
      </linearGradient>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
  </svg>

  <div class="overlay" id="overlay" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="art.js"></script>
  <script src="script.js"></script>
</body>
</html>
